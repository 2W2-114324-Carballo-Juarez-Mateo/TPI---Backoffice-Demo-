services:

  # ---------- Infraestructura ----------
  postgres-admin:
    image: postgres:16
    container_name: postgres-admin
    environment:
      POSTGRES_USER: backoffice
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-backoffice123}
      POSTGRES_DB: administration_db
    ports:
      - "5432:5432"
    volumes:
      - pg-admin-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backoffice"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-reporting:
    image: postgres:16
    container_name: postgres-reporting
    environment:
      POSTGRES_USER: backoffice
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-backoffice123}
      POSTGRES_DB: reporting_db
    ports:
      - "5433:5432"
    volumes:
      - pg-reporting-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backoffice"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.0        # KRaft (sin ZooKeeper)
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  eureka-server:
    build:
      context: ..
      dockerfile: backend/infrastructure/eureka-server/Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"

  config-server:
    build:
      context: ..
      dockerfile: backend/infrastructure/config-server/Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    volumes:
      - ../config:/config
    depends_on:
      - eureka-server

  gateway-local:
    build:
      context: ..
      dockerfile: backend/infrastructure/gateway-local/Dockerfile
    container_name: gateway-local
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - config-server

  # ---------- Servicios Backoffice ----------
  administration-service:
    build:
      context: ..
      dockerfile: backend/administration-service/Dockerfile
    container_name: administration-service
    ports:
      - "8092:8092"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ADMIN_DB_PASSWORD: ${DATABASE_PASSWORD:-backoffice123}
      REPORTING_DB_PASSWORD: ${DATABASE_PASSWORD:-backoffice123}
    depends_on:
      postgres-admin:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started

  reporting-service:
    build:
      context: ..
      dockerfile: backend/reporting-service/Dockerfile
    container_name: reporting-service
    ports:
      - "8093:8093"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REPORTING_DB_PASSWORD: ${DATABASE_PASSWORD:-backoffice123}
    depends_on:
      postgres-reporting:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started

volumes:
  pg-admin-data:
  pg-reporting-data: