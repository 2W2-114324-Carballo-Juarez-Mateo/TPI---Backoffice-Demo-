<header class="h-16 bg-surface/95 backdrop-blur-md text-ink flex-shrink-0 z-40 flex items-center justify-between px-4 sm:px-6 shadow-sm border-b-2 border-line transition-colors duration-200">
  <!-- Izquierda: Identidad Retro Arcade & Gateway -->
  <div class="flex items-center gap-4">
    <div class="flex items-center gap-3">
      <div class="bg-surface-2 px-2.5 py-1.5 rounded-sm border-2 border-line shadow-sm flex items-center justify-center">
        <app-logo-utn class="h-6 w-auto block" />
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-retro text-xs sm:text-sm tracking-tight text-brand font-bold">TUP ARCADE</span>
          <app-arcade-badge tone="magenta" appearance="solid" size="sm">v0.2.2</app-arcade-badge>
        </div>
        <span class="text-ink-soft text-xs font-mono block mt-0.5">BACKOFFICE INSTITUCIONAL • TEMA 12</span>
      </div>
    </div>

    <!-- Píldora Kafka Arcade HUD -->
    <div class="hidden lg:flex items-center gap-2">
      <app-arcade-badge tone="green" appearance="solid" size="md">
        <span class="w-2 h-2 rounded-full bg-slate-950 animate-pulse mr-1"></span>
        <span>KAFKA GATEWAY: {{ systemStatus().servicesOnline }}/{{ systemStatus().servicesTotal }} OK</span>
      </app-arcade-badge>
    </div>
  </div>

  <!-- Derecha: Selector de Tema, Seguridad 2FA & Perfil Docente -->
  <div class="flex items-center gap-3">
    <!-- Toggle Tema Claro / Oscuro (PiposLibrary Theme Switcher) -->
    <button
      (click)="themeService.toggleTheme()"
      [title]="themeService.currentTheme() === 'light' ? 'Cambiar a tema oscuro' : 'Cambiar a tema claro'"
      class="btn-arcade-pipos btn-arcade-neutral px-2.5 py-1.5 flex items-center gap-2"
    >
      @if (themeService.currentTheme() === 'light') {
        <span class="text-[13px] leading-none">🌙</span>
        <span class="hidden md:inline text-[8px] font-retro">CYBER DARK</span>
      } @else {
        <span class="text-[13px] leading-none">☀️</span>
        <span class="hidden md:inline text-[8px] font-retro">RETRO LIGHT</span>
      }
    </button>

    <!-- Píldora 2FA -->
    <div class="hidden sm:block">
      <app-arcade-badge tone="cyan" appearance="outline" size="md">
        <span class="material-symbols-outlined text-[12px] mr-1">verified_user</span>
        <span>2FA OK</span>
      </app-arcade-badge>
    </div>

    <!-- Tarjeta Perfil Docente -->
    <div class="flex items-center gap-2.5 bg-surface-2 px-3 py-1.5 rounded-sm border border-line">
      <div class="flex flex-col text-right">
        <span class="text-xs font-bold leading-tight text-ink">{{ systemStatus().userName }}</span>
        <span class="text-[9px] text-ink-soft font-mono leading-tight">{{ systemStatus().userRole }}</span>
      </div>
      <div class="w-7 h-7 rounded-sm bg-brand flex items-center justify-center text-white font-retro text-[9px] shadow-sm">
        {{ systemStatus().userInitials }}
      </div>
    </div>
  </div>
</header>
