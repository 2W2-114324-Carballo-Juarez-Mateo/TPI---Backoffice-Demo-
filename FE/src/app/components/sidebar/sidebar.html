<aside class="w-72 bg-surface/90 border-r-2 border-line flex flex-col flex-shrink-0 z-30 shadow-sm h-full select-none text-ink transition-colors duration-200">
  <!-- Buscador rápido de módulos -->
  <div class="p-3 border-b-2 border-line flex-shrink-0 bg-surface-2/40">
    <div class="relative">
      <span class="material-symbols-outlined absolute left-2.5 top-1/2 -translate-y-1/2 text-ink-soft text-[18px]">search</span>
      <input
        type="text"
        [value]="searchTerm()"
        (input)="onSearch($event)"
        placeholder="Buscar módulo (1 al 9)..."
        class="w-full pl-8 pr-3 py-1.5 text-xs bg-surface-2 border border-line rounded-sm text-ink placeholder:text-ink-soft focus:outline-none focus:border-brand font-mono transition-colors"
      />
    </div>
  </div>

  <!-- Lista de Navegación con Scroll -->
  <nav class="flex-1 px-2.5 py-3 space-y-1.5 overflow-y-auto">
    @for (mod of filteredModules(); track mod.route) {
      <a
        [routerLink]="mod.route"
        routerLinkActive="bg-brand text-white font-bold border-brand shadow-[0_2px_0_color-mix(in_srgb,var(--accent-primary)_65%,black)]"
        [routerLinkActiveOptions]="{ exact: false }"
        class="w-full text-left flex items-center justify-between px-3 py-2 rounded-sm text-xs transition-all text-ink-soft border border-transparent hover:bg-surface-2 hover:text-ink hover:border-line group"
      >
        <div class="flex items-center gap-2.5 truncate">
          <span class="material-symbols-outlined text-[18px] transition-colors group-hover:text-brand">
            {{ mod.icon }}
          </span>
          <span class="truncate font-sans font-medium">{{ mod.label }}</span>
        </div>
        <app-arcade-badge tone="neutral" appearance="outline" size="sm">
          MOD-0{{ mod.badge }}
        </app-arcade-badge>
      </a>
    } @empty {
      <div class="px-3 py-6 text-center text-xs text-ink-soft font-mono">
        No se encontraron módulos
      </div>
    }
  </nav>

  <!-- Footer Institucional de la barra lateral -->
  <div class="p-3 bg-surface-2 border-t-2 border-line text-[10px] text-ink-soft flex-shrink-0">
    <div class="flex items-center justify-between mb-2">
      <app-logo-utn class="h-4 w-auto opacity-80 block" />
      <span class="font-retro text-[8px] text-brand bg-brand/10 border border-brand/40 px-1.5 py-0.5 rounded-sm">
        v0.2.2 ARCADE
      </span>
    </div>
    <div class="flex items-center justify-between font-mono text-[9px] text-ink-soft">
      <span>UTN FRC • Tema 12</span>
      <span>Angular 21</span>
    </div>
  </div>
</aside>
