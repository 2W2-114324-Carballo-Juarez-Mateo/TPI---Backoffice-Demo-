server:
  port: 8092

spring:
  application:
    name: administration-service
  datasource:
    url: ${ADMIN_DB_URL:jdbc:postgresql://localhost:5432/administration_db}
    username: ${ADMIN_DB_USER:backoffice}
    password: ${ADMIN_DB_PASSWORD:backoffice123}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info